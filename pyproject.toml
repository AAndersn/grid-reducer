[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grid_reducer"
dynamic = ["version"]
description = "Reduce and anonymize CIM distribution feeder models for sharing."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = []
authors = [
  { name = "Kapil Duwadi", email = "kapil.duwadi@pnnl.gov" },
  { name = "Kaustav Bhattacharjee", email = "kaustav.bhattacharjee@pnnl.gov"},
  { name = "Alexander Anderson", email="Alexander.Anderson@pnnl.gov"},
  { name = "Rabayet Sadnan", email="rabayet.sadnan@pnnl.gov"}
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cim-graph>=0.6.0a2,<0.7",
  "cim-profiles>=0.1.0a2,<0.2",
  "cim-tables>=0.1.0a1,<0.2",
  "cim-topology>=0.1.0,<0.2",
  "click~=8.2.1",
  "jsonschema~=4.24",
  "pydantic~=2.11",
  "pyyaml~=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pre-commit~=4.2.0", 
  "pytest~=9.0.1", 
  "ruff~=0.11.12",
  "pytest-cov~=7.0.0"
]
doc = [
  "mkdocs-material~=9.6.14",
  "mike~=2.1.3"
]


[tool.ruff]
exclude = [".git", ".ruff_cache", ".venv", "_build", "build", "dist", "venv", "src/grid_reducer/config_models.py"]
line-length = 99
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
  "C901", # McCabe complexity
  "E4",   # imports formatting, wrong import spacing or grouping
  "E7",   # indentation issues
  "E9",   # runtime syntax errors
  "F",    # Pyflakes e.g. unused imports, undefined variables, redefined functions
  "W",    # minor style line line breaks, training whitespaces
  "B",    # flake8-bugbear
]
ignore = ["C901"]
per-file-ignores = { "__init__.py" = ["F401"] }

[project.scripts]
grid = "grid_reducer.cli:cli"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[project.urls]
Documentation = "https://grid-kitchen.github.io/grid-reducer/latest/"
Issues = "https://github.com/Grid-Kitchen/grid-reducer/issues"
Source = "https://github.com/Grid-Kitchen/grid-reducer"

[tool.hatch.version]
path = "src/grid_reducer/version.py"

[tool.uv]
prerelease = "allow"

# Not on PyPI yet (or the release lacks what grid-reducer needs): the sibling checkouts.
[tool.uv.sources]
cim-graph = { path = "../CIM-Graph", editable = true }
cim-profiles = { path = "../CIM-Profiles", editable = true }
cim-tables = { path = "../CIM-Tables", editable = true }
cim-topology = { path = "../CIM-Graph-Topology-Processor", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
addopts = "-p no:faulthandler"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_reducer"]

[tool.hatch.build.targets.sdist]

include = ["src/grid_reducer"]

